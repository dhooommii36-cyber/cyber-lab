<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER LAB</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #123525 0%, transparent 45%),
        #050807;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.container {
    width: 100%;
    max-width: 450px;
    padding: 35px 25px;
    background: rgba(13, 24, 18, 0.95);
    border: 1px solid #00ff88;
    border-radius: 20px;
    box-shadow: 0 0 30px #00ff8820;
    animation: appear 0.6s ease;
}
@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.logo {
    font-size: 34px;
    font-weight: bold;
    color: #00ff88;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #00ff8870;
    margin-bottom: 15px;
}
.line {
    width: 65px;
    height: 3px;
    background: #00ff88;
    margin: 15px auto 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px #00ff88;
}
h2 {
    font-size: 23px;
    margin-bottom: 12px;
}
p {
    color: #b8c9bf;
    font-size: 16px;
    line-height: 1.8;
}
.page {
    display: none;
}
#homePage {
    display: block;
}
button {
    background: #00ff88;
    color: #06130c;
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 25px;
    transition: 0.3s;
}
button:hover {
    background: #8affc3;
    box-shadow: 0 0 20px #00ff8870;
    transform: translateY(-3px);
}
button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
}
input, textarea {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    background: #07100b;
    color: white;
    border: 1px solid #245d3e;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
    font-family: Arial, sans-serif;
}
input:focus, textarea:focus {
    border-color: #00ff88;
    box-shadow: 0 0 12px #00ff8830;
}
textarea {
    resize: vertical;
    min-height: 120px;
}
input::placeholder,
textarea::placeholder {
    color: #82978a;
}
.back {
    background: transparent;
    color: #00ff88;
    border: 1px solid #00ff88;
    margin-right: 5px;
}
.back:hover {
    background: #00ff8815;
    color: white;
}
#status {
    color: #ff7777;
    margin-top: 12px;
    font-size: 14px;
}
.success-icon {
    width: 70px;
    height: 70px;
    border: 2px solid #00ff88;
    border-radius: 50%;
    color: #00ff88;
    font-size: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px #00ff8840;
}
.footer {
    margin-top: 30px;
    color: #63766a;
    font-size: 12px;
    letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="container page" id="homePage">
    <div class="logo">CYBER LAB</div>
    <div class="line"></div>
    <h2>مرحبًا بك 👋</h2>
    <p>
        مساحة رقمية للتواصل وإرسال الرسائل.
        يسعدنا استقبال رسالتك.
    </p>
    <button onclick="showPage('messagePage')">ابدأ الآن</button>
    <div class="footer">CYBER LAB © 2026</div>
</div>
<div class="container page" id="messagePage">
    <div class="logo">CYBER LAB</div>
    <div class="line"></div>
<h2>أهلًا بك في موقع</h2>
<p style="color:#00ff88; margin-bottom:20px;">
    عبد الرحمن زبن العتيبي
</p>
<p>اكتب رسالتك هنا 👇🏻</p>
<form id="messageForm">
    <input type="text" name="name"
    placeholder="اكتب اسمك" required>
    <textarea name="message"
    placeholder="اكتب رسالتك هنا..." required></textarea>
    <button type="submit" id="sendButton">
        إرسال الرسالة
    </button>
</form>
<p id="status"></p>
<button class="back" onclick="showPage('homePage')">
    رجوع
</button>
<div class="footer">CYBER LAB © 2026</div>
</div>
<div class="container page" id="thankYou">
    <div class="logo">CYBER LAB</div>
    <div class="line"></div>
<div class="success-icon">✓</div>
<h2>شكرًا لك</h2>
<p>تم الإرسال</p>
<button onclick="showPage('homePage')">
    العودة للرئيسية
</button>
<div class="footer">CYBER LAB © 2026</div>
</div>
<script>
function showPage(pageId) {
    document.querySelectorAll(".page").forEach(page => {
        page.style.display = "none";
    });
    document.getElementById(pageId).style.display = "block";
    window.scrollTo(0, 0);
}
const form = document.getElementById("messageForm");
form.addEventListener("submit", async function(event) {
    event.preventDefault();
    const button = document.getElementById("sendButton");
    const status = document.getElementById("status");
    const name = form.querySelector('[name="name"]').value;
    const message = form.querySelector('[name="message"]').value;
    button.disabled = true;
    button.textContent = "جاري الإرسال...";
    status.textContent = "";
    try {
        const response = await fetch(
            "https://formsubmit.co/ajax/dhooommii36@gmail.com",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    message: message,
                    _subject: "رسالة جديدة من CYBER LAB",
                    _template: "table"
                })
            }
        );
        const result = await response.json();
        if (response.ok && result.success) {
            form.reset();
            showPage("thankYou");
        } else {
            status.textContent =
            result.message || "تعذر الإرسال، حاول مرة أخرى.";
        }
    } catch (error) {
        status.textContent = "حدث خطأ في الاتصال، حاول مجددًا.";
    }
    button.disabled = false;
    button.textContent = "إرسال الرسالة";
});
</script>
</body>
</html>
